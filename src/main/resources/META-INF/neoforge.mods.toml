license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/viabedrockutility/icon.png"
authors="Oryxel"
description='''
ViaBedrock extension mod that added support to certain things.
'''

[[mixins]]
config="viabedrockutility.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="bedrockcameralib"
type="required"
versionRange="[1.2.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="beparticle"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"
