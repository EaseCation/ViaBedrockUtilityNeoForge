license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/viabedrockutility/icon.png"
authors="Oryxel"
description='''
ViaBedrock extension mod that added support to certain things.
'''

[[mixins]]
config="viabedrockutility.mixins.json"

# Iris-targeting mixins, isolated in their own config with "required": false so the whole config is
# skipped (no crash) when Iris is absent. See mixin.iris.FullyBufferedMultiBufferSourceMixin.
[[mixins]]
config="viabedrockutility.iris.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="bedrockcameralib"
type="required"
versionRange="[1.2.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="beparticle"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

# Sodium: optional rendering optimization. VBU's C2 push fast path (SodiumPushBackend) activates
# automatically when Sodium is present; without it VBU falls back to vanilla addVertex. Never required.
[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0.7.0,)"
ordering="AFTER"
side="CLIENT"

# Iris: optional. When present, VBU downgrades Iris' per-endBatch render-order solver to the cheap
# insertion-order manager while shaders are OFF (mixin.iris.FullyBufferedMultiBufferSourceMixin).
# ordering=AFTER so our mixin applies over Iris' classes. Never required.
[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[1.9.0,)"
ordering="AFTER"
side="CLIENT"
