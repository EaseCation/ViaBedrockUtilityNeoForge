name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Mocha, BedrockMotion, CubeConverter, bedrockcameralib, beparticle and the NeteaseBridge / diagnostics
      # libraries come from the EaseCation Yunxiao repository (repository secrets YUNXIAO_MAVEN_*).
      - name: Build and run tests with public fixtures
        env:
          ORG_GRADLE_PROJECT_yunxiaoMavenUsername: ${{ secrets.YUNXIAO_MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_yunxiaoMavenPassword: ${{ secrets.YUNXIAO_MAVEN_PASSWORD }}
        run: sh ./gradlew --init-script .github/gradle-ci.init.gradle build --no-daemon --no-configuration-cache --console=plain
