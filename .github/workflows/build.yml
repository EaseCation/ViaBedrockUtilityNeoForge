name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout checked revision
        uses: actions/checkout@v4
        with:
          path: ViaBedrockUtilityNeoForge
          fetch-depth: 0
          fetch-tags: true

      # Dependency revisions from NeoForgeWorkspace@491b53e8e04c78d6c1f2b1111e085cab7f5b0e1e.
      - name: Checkout Mocha
        uses: actions/checkout@v4
        with:
          repository: EaseCation/mocha
          ref: ed2c48cfb3250df3b6ad01957053bc11da5eacf4
          path: dependencies/Mocha

      - name: Checkout BedrockMotion
        uses: actions/checkout@v4
        with:
          repository: EaseCation/BedrockMotion
          ref: 262ee8862cdce6b222dd7844f4d4ec669859b325
          path: dependencies/BedrockMotion

      - name: Checkout CubeConverter
        uses: actions/checkout@v4
        with:
          repository: EaseCation/CubeConverter
          ref: 6b4f5b1dfc9deefe23809a8b89e9d4425de34bdd
          path: dependencies/CubeConverter

      # Released unchanged from https://jepack.easecation.net/mods/; keep these inputs in Git.
      - name: Verify released camera and particle dependencies
        working-directory: ViaBedrockUtilityNeoForge
        run: |
          sha256sum --check <<'HASHES'
          230d4d2c5340eb122d36a6b99a356895be6c885a2a87f8e57088c2ac413c3d4e  libs/ci/bedrockcameralib-1.2.1-obf.jar
          b66954aa1fb44540e01f3b255107969ac00a42a52023ddd38be5a0f3b78ac22b  libs/ci/beparticle-1.0.0-obf.jar
          HASHES

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests with public fixtures
        working-directory: ViaBedrockUtilityNeoForge
        run: sh ./gradlew --init-script .github/gradle-ci.init.gradle build --no-daemon --no-configuration-cache --console=plain
