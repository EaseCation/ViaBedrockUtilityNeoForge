pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

includeBuild("../NeteaseBridge") {
    dependencySubstitution {
        substitute module("net.easecation:easecation-async-logging") using project(":easecation-async-logging")
        substitute module("net.easecation:netease-bridge-client-common") using project(":netease-bridge-client-common")
        substitute module("net.easecation:netease-bridge-client-neoforge") using project(":netease-bridge-client-neoforge")
    }
}
