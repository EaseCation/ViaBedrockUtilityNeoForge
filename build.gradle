import org.oryxel.viabedrockutility.generator.EnumGeneratorTask

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.EaseCation"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def sodiumTestEnabled = providers.gradleProperty('vbuTestSodium')
        .map { it.toBoolean() }
        .getOrElse(false)

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = project.file("run/${name}")
        }
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Runs JUnit with the NeoForge/Minecraft classpath and Mixin bootstrap, without launching a game client.
    // testedMod also adds sourceSets.test to this mod's transformed classloader; without it, JUnit can
    // discover test class names but ModLauncher's module classloader cannot load their bytecode.
    unitTest {
        testedMod = mods."${mod_id}"
        enable()
    }
}

dependencies {
    // api (not implementation): AttachableQueryProvider exposes BedrockMotion's transitive mocha
    // Value in its method signature, so downstream mods compiling against the query API need it.
    api('com.github.EaseCation:BedrockMotion:1.0.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.github.EaseCation', module: 'CubeConverter'
    }
    jarJar('com.github.EaseCation:BedrockMotion:1.0.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.github.EaseCation', module: 'CubeConverter'
    }
    implementation 'nakern.be_camera:bedrockcameralib:1.2.0'
    // bedrockcameralib exposes Kotlin 2.1 Function types in its public API but its POM does not declare
    // kotlin-stdlib. Keep it on both the compile classpath and the standalone mod's JarJar runtime.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    jarJar 'org.jetbrains.kotlin:kotlin-stdlib:2.1.10'
    implementation 'net.easecation.beparticle:beparticle:1.0.0'
    implementation 'com.github.EaseCation:CubeConverter:1.3'
    jarJar 'com.github.EaseCation:CubeConverter:1.3'
    // BEParticle is a required runtime mod and owns the shared Mocha/Javassist JarJar modules.
    // Bundling Mocha again here creates a second class identity in NeoForge's unit-test module layer.

    // Sodium (optional at runtime): compileOnly lets the isolated SodiumVertexPushBackend compile against
    // VertexBufferWriter + EntityVertex. SodiumPushBackend loads that adapter reflectively and fails closed
    // to the vanilla emitter when Sodium is absent or its public vertex ABI is incompatible. It is neither
    // JarJar-bundled nor declared as a required mod dependency. Vendored in libs/ to avoid a Maven dependency.
    compileOnly files('libs/sodium-neoforge-0.7.3.jar')

    // Iris (optional at runtime): compileOnly so the shader-aware render-order mixin
    // (mixin.iris.FullyBufferedMultiBufferSourceMixin / VbuShaderAwareRenderOrderManager) can compile
    // against Iris' batchedentityrendering + IrisApi types. Not bundled and not a required dependency —
    // at runtime, if Iris is absent, the iris mixin config ("required": false) is skipped entirely and
    // none of these classes ever load. Vendored in libs/ to avoid a maven dependency.
    compileOnly files('libs/iris-neoforge-1.9.6+mc1.21.8.jar')

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.objenesis:objenesis:3.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The default test runtime deliberately excludes Sodium. Opt in to the integration profile with
    // `-PvbuTestSodium=true`; compileOnly remains available to compile Sodium-specific test references.
    if (sodiumTestEnabled) {
        testRuntimeOnly files('libs/sodium-neoforge-0.7.3.jar')
    }
}

def enumSourceDir = layout.buildDirectory.dir("generated/enums/main/java")
def enumGeneratorTask = tasks.register("enumGeneratorTask", EnumGeneratorTask) {
    outputDirectory = enumSourceDir
}
tasks.compileJava.dependsOn(enumGeneratorTask)

sourceSets.main.java {
    srcDir(enumSourceDir)
}

// The production jar task includes generated JarJar resources directly, while ModDev's tested mod
// only sees source-set outputs. Mirror them into test resources so unit tests load the same embedded
// BedrockMotion/CubeConverter modules without changing the production resource layout.
sourceSets.test.resources.srcDir(layout.buildDirectory.dir('generated/jarJar'))
tasks.named('processTestResources').configure {
    dependsOn tasks.named('jarJar')
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from(project.file('libs/vanilla_packs')) {
        into 'assets/viabedrockutility/vanilla_packs'
        include '*.mcpack'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    dependsOn tasks.named('jarJar')
    useJUnitPlatform()
    // ModDev supplies these libraries through the tested-mod/module layer. Keeping their project
    // artifacts on the Gradle worker classpath as well gives Mocha's Value/Scope interfaces two
    // class identities. Filter only the worker classpath; testRuntimeClasspath remains untouched so
    // prepareNeoForgeTestFiles still discovers the required Bedrock runtime mods.
    classpath = classpath.filter { file ->
        def path = file.absolutePath.toLowerCase(Locale.ROOT)
        !path.contains('bedrockmotion') &&
                !path.contains('cubeconverter') &&
                !path.contains('mocha-3.0.1') &&
                !path.contains('javassist-3.30.2')
    }
    systemProperty 'vbu.testSodium', sodiumTestEnabled.toString()
    // Legacy parser utilities are executable main classes in src/test, not JUnit tests. Their default-package
    // classes are also intentionally outside the tested mod's named module.
    exclude 'AnimationParserTest.class', 'MaterialParserTest.class'
    failOnNoDiscoveredTests = true
}

def productionJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyNoBundledSodium') {
    group = 'verification'
    description = 'Verifies that the optional Sodium dependency is not bundled into the production jar.'
    dependsOn tasks.named('jar')
    inputs.file(productionJar)

    doLast { task ->
        final File jarFile = task.inputs.files.singleFile
        final java.util.zip.ZipFile zip = new java.util.zip.ZipFile(jarFile)
        try {
            final List<String> forbiddenEntries = []
            final Enumeration<? extends java.util.zip.ZipEntry> entries = zip.entries()
            while (entries.hasMoreElements()) {
                final String name = entries.nextElement().name
                final String lowerName = name.toLowerCase(Locale.ROOT)
                if (name.startsWith('net/caffeinemc/') || (lowerName.endsWith('.jar') && lowerName.contains('sodium'))) {
                    forbiddenEntries.add(name)
                }
            }

            final java.util.zip.ZipEntry metadata = zip.getEntry('META-INF/jarjar/metadata.json')
            if (metadata != null) {
                final String contents = zip.getInputStream(metadata).withCloseable {
                    new String(it.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                }.toLowerCase(Locale.ROOT)
                if (contents.contains('net.caffeinemc') || contents.contains('"sodium"')) {
                    forbiddenEntries.add(metadata.name + ' (references Sodium)')
                }
            }

            if (!forbiddenEntries.isEmpty()) {
                throw new GradleException("Optional Sodium classes/artifacts were bundled into ${jarFile.name}: ${forbiddenEntries}")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyNoBundledSodium')
}
