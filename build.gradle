import org.oryxel.viabedrockutility.generator.EnumGeneratorTask

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
        content {
            includeGroup "com.github.EaseCation"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            gameDirectory = project.file("run/${name}")
        }
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation('com.github.EaseCation:BedrockMotion:1.0.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.github.EaseCation', module: 'CubeConverter'
    }
    jarJar('com.github.EaseCation:BedrockMotion:1.0.0') {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.github.EaseCation', module: 'CubeConverter'
    }
    implementation 'nakern.be_camera:bedrockcameralib:1.2.0'
    implementation 'net.easecation.beparticle:beparticle:1.0.0'
    implementation 'com.github.EaseCation:CubeConverter:1.3'
    jarJar 'com.github.EaseCation:CubeConverter:1.3'
    jarJar 'team.unnamed:mocha:3.0.1'

    // Sodium (optional at runtime): compileOnly so the C2 push fast path (SodiumPushBackend /
    // CuboidMixin.vbu$renderCuboidFastPush) can compile against VertexBufferWriter + EntityVertex.
    // Not bundled (jarJar) and not a required mod dependency — at runtime, if Sodium is absent,
    // SodiumPushBackend.SUPPORTED == false and the JIT folds away the push branch, so the fallback
    // addVertex path runs with zero Sodium footprint. Vendored in libs/ to avoid a maven dependency.
    compileOnly files('libs/sodium-neoforge-0.7.3.jar')

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    testImplementation 'com.google.code.gson:gson:2.10.1'
}

def enumSourceDir = layout.buildDirectory.dir("generated/enums/main/java")
def enumGeneratorTask = tasks.register("enumGeneratorTask", EnumGeneratorTask) {
    outputDirectory = enumSourceDir
}
tasks.compileJava.dependsOn(enumGeneratorTask)

sourceSets.main.java {
    srcDir(enumSourceDir)
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from(project.file('libs/vanilla_packs')) {
        into 'assets/viabedrockutility/vanilla_packs'
        include '*.mcpack'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    failOnNoDiscoveredTests = false
}
